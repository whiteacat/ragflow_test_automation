# 术语等价表（GEN-02 标签匹配用）。改完即时生效（热加载，最多延迟 1 秒）。
#
# 写法一：简写，只声明等价词
#   水压试验: [水压强度试验, 打压试验]
# 写法二：显式写法，可附核心词（核心词全部命中按 0.8 分近似命中）
#   过热器:
#     synonyms: [过热段]
#     core: [过热, 蒸汽温度]
#
# 注意：
# 1) 等价词必须是**同义**，不是「相关」或「同族」——例如「给水前置泵」与「主给水泵」
#    是不同设备，写成同义词会把错答判成对答；
# 2) 核心词不自动生成（中文分词不可靠），只在显式配置时生效；
# 3) 等价组做传递闭包，A~B、B~C 会让 A~C 也等价；
# 4) 只在这里收录经专业人员确认过的术语，其余留空按纯字面口径判定。

# 已确认可直接使用（行业通用简称）
